databaseChangeLog:
  - changeSet:
      id: 0001-api-client
      author: banking-api
      comment: Client applications registered to call the API, and whether each is active.
      changes:
        - createTable:
            tableName: api_client
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_api_client
              - column:
                  name: client_id
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_api_client_client_id
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE api_client ADD CONSTRAINT ck_api_client_status CHECK (status IN ('ACTIVE', 'SUSPENDED'))

  - changeSet:
      id: 0001-api-client-seed
      author: banking-api
      comment: The client applications in the auth service's clients realm (cba-auth realms/clients.yaml).
      changes:
        - insert:
            tableName: api_client
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: client_id, value: app }
              - column: { name: name, value: 1UBank App }
              - column: { name: status, value: ACTIVE }
        - insert:
            tableName: api_client
            columns:
              - column: { name: id, valueComputed: gen_random_uuid() }
              - column: { name: client_id, value: irecharge }
              - column: { name: name, value: iRecharge }
              - column: { name: status, value: ACTIVE }
