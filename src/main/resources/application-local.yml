# Local run against the docker-compose database and cba-auth on localhost:8180.
spring:
  datasource:
    url: ${BANKING_API_DB_URL:jdbc:postgresql://localhost:5434/banking_api}
    username: ${BANKING_API_DB_USERNAME:banking_api}
    password: ${BANKING_API_DB_PASSWORD:banking_api}

banking-api:
  auth-service:
    token-url: ${BANKING_API_AUTH_TOKEN_URL:http://localhost:8180/realms/clients/protocol/openid-connect/token}
    jwk-set-uri: ${BANKING_API_AUTH_JWK_SET_URI:http://localhost:8180/realms/clients/protocol/openid-connect/certs}
    issuer: ${BANKING_API_AUTH_ISSUER:http://localhost:8180/realms/clients}

logging:
  structured:
    format:
      console: ${BANKING_API_LOG_FORMAT:}
