<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1UBank Banking API</title>
  </head>
  <body>
    <!--
      API reference for the Banking API, rendered by Scalar from api/banking-api.yaml.
      The running Banking API serves it at /docs/. To preview contract edits, serve the repository root:
        python3 -m http.server 8090   →   http://localhost:8090/docs/
    -->
    <script id="api-reference" data-url="../api/banking-api.yaml"></script>
    <script>
      // Served by a Banking API, "Try it" calls that same Banking API (local, dev, uat or prod).
      // On the preview server (port 8090) there is no API, so the contract's own servers are listed.
      var configuration = { metaData: { title: '1UBank Banking API' }, hideClientButton: true, telemetry: false };
      if (location.port !== '8090') {
        configuration.servers = [{ url: location.origin, description: 'This Banking API' }];
      }
      document.getElementById('api-reference').dataset.configuration = JSON.stringify(configuration);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.34.6/dist/browser/standalone.js"></script>
  </body>
</html>
