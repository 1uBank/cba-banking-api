  /v1/virtual-accounts:
    post:
      tags: [Virtual accounts]
      operationId: createVirtualAccount
      summary: Create a static virtual account
      description: |
        Creates a permanent virtual account under an owned parent account. The virtual account
        belongs to the same customer as the parent, and is owned by the same client.

        - Any `type` can be created. Each type is opened on the savings product the bank has set up for it;
          a type with no product yet is refused with `422 VIRTUAL_ACCOUNT_TYPE_UNAVAILABLE`.
        - The name payers see on name enquiry is built by the bank as `<owner's name> - <label>`.
          The owner's name always comes from the customer's verified details; only `label` is
          the client's.
        - For `AIRTIME`, send `accountNumber`: the customer's phone number, without the leading 0.
          For every other type, leave it out; a number is allocated. A number already in use
          returns `409 ACCOUNT_NUMBER_TAKEN`.
        - Credits to the virtual account count towards the customer's KYC balance limit.
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualAccountRequest'
            example:
              label: Smart Transfer
              parentAccountNumber: '2000000158'
              type: SMART_TRANSFER
      responses:
        '201':
          description: Virtual account created.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccount'
              example:
                accountNumber: '9000001234'
                name: Ada Obi - Smart Transfer
                label: Smart Transfer
                parentAccountNumber: '2000000158'
                type: SMART_TRANSFER
                status: ACTIVE
                createdDate: '2026-11-08T10:15:00+01:00'
                updatedDate: '2026-11-08T10:15:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: The requested `accountNumber` is already in use (`ACCOUNT_NUMBER_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'
    get:
      tags: [Virtual accounts]
      operationId: listVirtualAccounts
      summary: List static virtual accounts
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - name: parentAccountNumber
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountNumber'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VirtualAccountType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The client's virtual accounts matching the filters.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/virtual-accounts/{accountNumber}:
    get:
      tags: [Virtual accounts]
      operationId: getVirtualAccount
      summary: Get a static virtual account
      description: For its balance and history, use the account and transaction calls with the same number.
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The virtual account.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    patch:
      tags: [Virtual accounts]
      operationId: renameVirtualAccount
      summary: Change a static virtual account's label
      description: |
        Changes the label, and so the name payers see on name enquiry (`<owner's name> - <label>`).
        Nothing else changes.
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  $ref: '#/components/schemas/VirtualAccountLabel'
            example:
              label: Shop
      responses:
        '200':
          description: Label changed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /v1/virtual-accounts/{accountNumber}/close:
    post:
      tags: [Virtual accounts]
      operationId: closeVirtualAccount
      summary: Close a static virtual account
      description: |
        Closes the virtual account for good: payments to it are refused from then on, and its
        number is never given to another account.

        - The balance must be zero: move it to the parent first. Otherwise `422 ACCOUNT_NOT_EMPTY`.
        - No hold or block may be in place. Otherwise `422 ACCOUNT_RESTRICTED`.
        - Closing a closed virtual account returns it unchanged.
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Closed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/invoices:
    post:
      tags: [Invoices]
      operationId: createInvoice
      summary: Create an invoice (dynamic virtual account)
      description: |
        Allocates a temporary account number for one expected payment. Show it to the payer; they
        pay into it by bank transfer from any bank.

        - `collectionAccountNumber` must be an owned account: the payment is credited there.
        - `expiryDate` is at most 60 minutes ahead; it defaults to 60 minutes.
        - The name payers see on name enquiry is `<collection account owner's name> - <label>`.
        - When the payment arrives, an `InvoicePaid` event is delivered;
          `GET /v1/invoices/{invoiceReference}` shows the same.

        The client chooses what is accepted:

        - `amountRule`: `ANY` (the default) credits whatever arrives; `EXACT` refuses any other
          amount; `AT_LEAST` refuses less than `amount`.
        - `multiplePayments`: `false` (the default) refuses payments after the first accepted one;
          `true` accepts payments until `expiryDate`, and `amountPaid` is their total.

        A refused payment never leaves the payer: their bank is told the account cannot take it.
        A payment after `expiryDate` is always refused, and an unpaid invoice ends as `EXPIRED`.
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
            example:
              invoiceReference: ORD-1042-ATTEMPT-1
              collectionAccountNumber: '2000000079'
              amount: '5000.00'
              description: Order 1042
              label: Order 1042
              amountRule: EXACT
              customerEmail: payments@acmestores.example
              expiryDate: '2026-11-08T11:15:00+01:00'
      responses:
        '201':
          description: Invoice created, or the original invoice for an earlier call with the same reference.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                invoiceReference: ORD-1042-ATTEMPT-1
                accountNumber: '9100004321'
                accountName: Acme Stores - Order 1042
                collectionAccountNumber: '2000000079'
                amount: '5000.00'
                amountRule: EXACT
                multiplePayments: false
                description: Order 1042
                label: Order 1042
                customerEmail: payments@acmestores.example
                status: PENDING
                expiryDate: '2026-11-08T11:15:00+01:00'
                createdDate: '2026-11-08T10:15:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/invoices/{invoiceReference}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Get an invoice and whether it has been paid
      security:
        - bearerToken: []
        - clientCredentials: [virtual-accounts]
      parameters:
        - name: invoiceReference
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TransactionReference'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The invoice.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
              example:
                invoiceReference: ORD-1042-ATTEMPT-1
                accountNumber: '9100004321'
                accountName: Acme Stores - Order 1042
                collectionAccountNumber: '2000000079'
                amount: '5000.00'
                status: PAID
                amountPaid: '5000.00'
                sessionId: '000013261108103000123456789012'
                payer:
                  accountName: JOHN DOE
                  accountNumber: '0123456789'
                  institutionCode: '000013'
                  bankName: GTBank
                paidDate: '2026-11-08T10:30:00+01:00'
                expiryDate: '2026-11-08T11:15:00+01:00'
                createdDate: '2026-11-08T10:15:00+01:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No invoice with this reference for this client (`INVOICE_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/holds:
    post:
      tags: [Holds]
      operationId: placeHold
      summary: Place a hold on an account
      description: |
        The account must be owned by the client. Placing a hold with a `transactionReference` already used
        returns the original hold.
      security:
        - bearerToken: []
        - clientCredentials: [transfers]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceHoldRequest'
            example:
              accountNumber: '2000000158'
              amount: '2500.00'
              reason: Electricity token purchase
              transactionReference: LIEN-7Q2K9X1M4B
      responses:
        '201':
          description: Hold placed, or the original hold for an earlier call with the same reference.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
              example:
                transactionReference: LIEN-7Q2K9X1M4B
                holdTransactionId: 95501
                accountNumber: '2000000158'
                savingsId: 158
                clientId: 10
                amount: '2500.00'
                reason: Electricity token purchase
                status: ACTIVE
                createdDate: '2026-11-08T10:15:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/holds/release:
    post:
      tags: [Holds]
      operationId: releaseHold
      summary: Release a hold
      description: |
        Identify the hold by the `transactionReference` it was placed with. Migrated holds,
        placed before the Banking API, have no such reference; release those by `accountNumber`
        and `holdTransactionId`.

        Any hold on the client's customers' accounts can be released here, including one placed by bank
        staff in the back office. A hold is released once. Releasing it again returns the original result.
      security:
        - bearerToken: []
        - clientCredentials: [transfers]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseHoldRequest'
            examples:
              byReference:
                summary: A hold placed through this API
                value:
                  transactionReference: LIEN-7Q2K9X1M4B
              byHoldTransactionId:
                summary: A migrated hold
                value:
                  accountNumber: '2000000158'
                  holdTransactionId: 88214
      responses:
        '200':
          description: Released.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No hold matching this for this client (`HOLD_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/holds/{transactionReference}:
    get:
      tags: [Holds]
      operationId: getHold
      summary: Get a hold
      security:
        - bearerToken: []
        - clientCredentials: [transfers]
      parameters:
        - name: transactionReference
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TransactionReference'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No hold with this reference for this client (`HOLD_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/accounts/{accountNumber}/blocks:
    post:
      tags: [Blocks]
      operationId: placeBlock
      summary: Block an account
      description: |
        - `CREDIT`: payments into the account are refused; the payer's bank is told the account
          cannot take them, so the money never leaves the payer.
        - `DEBIT`: money cannot leave the account.
        - `ALL`: both.

        The account must be owned by the client. Blocking what is already blocked returns the
        current blocks unchanged.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBlockRequest'
            example:
              type: CREDIT
              reason: Cashier on leave
      responses:
        '201':
          description: Blocked. The block now in place.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlocks'
              example:
                accountNumber: '9000001234'
                block: CREDIT
                reason: Cashier on leave
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
    get:
      tags: [Blocks]
      operationId: listBlocks
      summary: List an account's blocks
      description: The block in place on the account, whether placed through this API or by bank staff.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The account's blocks.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlocks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /v1/accounts/{accountNumber}/blocks/{type}/lift:
    post:
      tags: [Blocks]
      operationId: liftBlock
      summary: Lift a block
      description: |
        Lifts the block of this `type`, whether placed through this API or by bank staff. Lifting
        `DEBIT` from an `ALL` block leaves `CREDIT` in place, and the other way round. Lifting a block
        that is not in place returns the current block unchanged.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BlockType'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lifted. The block still in place, if any.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBlocks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/debits:
    post:
      tags: [Service debits]
      operationId: createServiceDebit
      summary: Debit a customer for a service
      description: |
        Debits a customer's account for a service the client provides. The payment type, sent by
        name, decides where the money goes in the ledger. Any payment type the bank has set up can be
        used (see `GET /v1/payment-types`); a name the bank does not have is refused with
        `422 PAYMENT_TYPE_UNKNOWN`. The account must be owned by the client. A retry with the same
        `transactionReference` returns the original debit.
      security:
        - bearerToken: []
        - clientCredentials: [transfers]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDebitRequest'
            example:
              accountNumber: '2000000158'
              paymentType: SMS Alert Fee
              amount: '24.00'
              narration: SMS alerts, October 2026
              transactionReference: SMS-2026-10-0000158
      responses:
        '201':
          description: Debit posted, or the original debit for an earlier call with the same reference.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDebit'
              example:
                transactionReference: SMS-2026-10-0000158
                transactionId: '95610'
                accountNumber: '2000000158'
                paymentType: SMS Alert Fee
                amount: '24.00'
                narration: SMS alerts, October 2026
                transactionStatus: CONFIRMED
                transactionDate: '2026-11-08T10:15:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          $ref: '#/components/responses/ReferenceConflict'
        '422':
          $ref: '#/components/responses/BusinessRuleRefused'

  /v1/accounts/{accountNumber}/transactions:
    get:
      tags: [Transactions]
      operationId: listAccountTransactions
      summary: List an account's transactions
      description: |
        Newest first. `fromDate` and `toDate` are both included, so there is no need to add a day
        to `toDate`. Leave both out for the last 30 days.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-11-01'
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-11-08'
        - name: transactionType
          in: query
          required: false
          description: Only credits or only debits.
          schema:
            $ref: '#/components/schemas/TransactionType'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The transactions.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AccountNotFound'

  /v1/accounts/{accountNumber}/transactions/{transactionId}:
    get:
      tags: [Transactions]
      operationId: getAccountTransaction
      summary: Get one transaction on an account
      description: |
        By the core ledger's `transactionId`, for example from an event or from a transfer's
        response. Works the same for every kind of transaction: there is no separate intra-bank
        lookup. When the transaction is one side of an intra-bank transfer, `intraBank` is `true`
        and `transfer` shows both sides.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The transaction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
              example:
                transactionId: '95413'
                accountNumber: '2000000110'
                transactionType: DEBIT
                kind: INTRA_BANK_TRANSFER
                amount: '3400000.00'
                currency: NGN
                balanceBefore: '177629171.87'
                balanceAfter: '174229171.87'
                narration: FARMER PAYMENT - 2000000110 TO 0000019044
                transactionReference: TRX-123456ABCDEF012345
                transactionStatus: CONFIRMED
                reversed: false
                intraBank: true
                transfer:
                  transferId: '812'
                  fromAccountNumber: '2000000110'
                  fromTransactionId: '95413'
                  toAccountNumber: '0000019044'
                  toTransactionId: '95414'
                counterparty:
                  accountName: FATIMA AKPAN
                  accountNumber: '0000019044'
                  institutionCode: '090605'
                  bankName: 1UBank
                transactionDate: '2026-10-28T10:15:00+01:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No such transaction on this account, or the account is not owned by the client (`TRANSACTION_NOT_FOUND`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/transactions:
    get:
      tags: [Transactions]
      operationId: searchTransactions
      summary: Find transactions by transaction reference or NIBSS session ID
      description: |
        Send `transactionReference` (the client's reference on a transfer, debit or hold) or
        `sessionId` (an inbound or outbound NIP transfer's session ID). Only transactions on owned accounts are
        returned.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - name: transactionReference
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TransactionReference'
        - name: sessionId
          in: query
          required: false
          schema:
            type: string
          example: '000013261108103000123456789012'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Matching transactions; empty when none match.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          description: Neither `transactionReference` nor `sessionId` was sent (`VALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/products:
    get:
      tags: [Reference data]
      operationId: listProducts
      summary: List savings products
      description: The products accounts can be opened on, with the `productId` to send.
      security:
        - bearerToken: []
        - clientCredentials: [accounts]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/payment-types:
    get:
      tags: [Reference data]
      operationId: listPaymentTypes
      summary: List payment types
      description: The payment types the bank has set up, for service debits (for example bills or SMS fees).
      security:
        - bearerToken: []
        - clientCredentials: [transfers]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The payment types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /v1/auth/token`, sent as `Authorization: Bearer <access_token>`.
        In these docs, paste it here, or use `clientCredentials` to have the token fetched for you.
    clientCredentials:
      type: oauth2
      description: |
        Client credentials. Tokens last 15 minutes. In these docs, enter the client ID and secret and
        press Authorize: the token is fetched and sent as `Authorization: Bearer <access_token>`.
      flows:
        clientCredentials:
          tokenUrl: /v1/auth/token
          scopes:
            customers: Create, find and update customers; set the KYC level
            accounts: Open accounts; read details, balances and history
            virtual-accounts: Create, rename and query static and dynamic virtual accounts
            transfers: Intra-bank transfers, service debits, holds
            interbank: Bank list, name enquiry, interbank transfers

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: The client's ID for this request, returned on the response and recorded in the bank's logs.
      schema:
        type: string
        maxLength: 64

    ClientId:
      name: clientId
      in: path
      required: true
      description: The customer's ID, as returned when the customer was created.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10

    AccountNumberPath:
      name: accountNumber
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountNumber'
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`nextCursor` from the previous page. Leave out for the first page.'
      schema:
        type: string

  headers:
    CorrelationId:
      description: The correlation ID for this request (as sent, or generated).
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or a field is invalid (`VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://docs.cba.1ubank.example/problems/validation-failed
            title: Request is not valid
            status: 400
            code: VALIDATION_FAILED
            detail: destinationAccountNumber must be exactly 10 digits
            correlationId: 7f3c2a1e-9b0d-4c55-8e1f-2a6b9c0d1e2f
            errors:
              - field: destinationAccountNumber
                message: must be exactly 10 digits
    Unauthorized:
      description: |
        The token is missing, invalid or expired (`UNAUTHORIZED`). Get a new token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The client does not have the scope for this call (`FORBIDDEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    AccountNotFound:
      description: |
        The account does not exist, is not owned by the client, or is closed (`ACCOUNT_NOT_FOUND`). The API
        does not say which.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    CustomerNotFound:
      description: The customer does not exist or does not belong to the client (`CUSTOMER_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ReferenceConflict:
      description: |
        `REFERENCE_REUSED`: this `transactionReference` was already used with a different request.
        `REQUEST_IN_PROGRESS`: the first request with this reference is still running; retry later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://docs.cba.1ubank.example/problems/reference-reused
            title: Reference already used
            status: 409
            code: REFERENCE_REUSED
            detail: transactionReference TRX-123456ABCDEF012345 was already used with a different request
            correlationId: 7f3c2a1e-9b0d-4c55-8e1f-2a6b9c0d1e2f
    BusinessRuleRefused:
      description: |
        Refused by a banking rule; nothing was posted. `code` is one of `INSUFFICIENT_FUNDS`,
        `LIMIT_EXCEEDED`, `ACCOUNT_NOT_ACTIVE`, `ACCOUNT_RESTRICTED`, `SCREENING_REFUSED`,
        `VIRTUAL_ACCOUNT_TYPE_UNAVAILABLE`, `PAYMENT_TYPE_UNKNOWN`, `ACCOUNT_NOT_EMPTY`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://docs.cba.1ubank.example/problems/limit-exceeded
            title: Limit exceeded
            status: 422
            code: LIMIT_EXCEEDED
            detail: This transfer is over the customer's daily limit of 200000.00
            correlationId: 7f3c2a1e-9b0d-4c55-8e1f-2a6b9c0d1e2f
    UpstreamUnavailable:
      description: |
        The core ledger or NIBSS could not be reached (`UPSTREAM_UNAVAILABLE`). For a transfer,
        retry with the same `transactionReference`; it is never posted twice.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamTimeout:
      description: The core ledger or NIBSS did not answer in time (`UPSTREAM_TIMEOUT`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_id:
          type: string
          description: The client ID. Optional if sent as HTTP Basic authentication.
        client_secret:
          type: string
          format: password
          description: The client secret. Optional if sent as HTTP Basic authentication.

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Seconds until the token expires.
          example: 900
        scope:
          type: string
          description: Space-separated scopes granted to the client.

    TokenError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid_client
        error_description:
          type: string

    Error:
      type: object
      description: |
        RFC 9457 problem details, served as `application/problem+json`. `code` is stable and meant
        for programmatic handling; `title` and `detail` are human-readable and may change.
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri
          description: Identifies the kind of problem; one URI per `code`.
        title:
          type: string
          description: Short summary of the kind of problem.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: Stable error code. Branch on this.
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - UNSUPPORTED_MEDIA_TYPE
            - ACCOUNT_NOT_FOUND
            - TRANSFER_NOT_FOUND
            - CUSTOMER_NOT_FOUND
            - CUSTOMER_EXISTS
            - ACCOUNT_NUMBER_TAKEN
            - VIRTUAL_ACCOUNT_TYPE_UNAVAILABLE
            - INVOICE_NOT_FOUND
            - HOLD_NOT_FOUND
            - PAYMENT_TYPE_UNKNOWN
            - TRANSACTION_NOT_FOUND
            - REFERENCE_REUSED
            - REQUEST_IN_PROGRESS
            - INSUFFICIENT_FUNDS
            - LIMIT_EXCEEDED
            - ACCOUNT_NOT_ACTIVE
            - ACCOUNT_RESTRICTED
            - ACCOUNT_NOT_EMPTY
            - SCREENING_REFUSED
            - UPSTREAM_UNAVAILABLE
            - UPSTREAM_TIMEOUT
            - INTERNAL_ERROR
        correlationId:
          type: string
        errors:
          type: array
          description: For `VALIDATION_FAILED`, one entry per invalid field.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    Amount:
      type: string
      description: An amount sent to the API, in naira as a decimal string with at most two decimal places. Greater than zero.
      pattern: '^(?=.*[1-9])\d{1,15}(\.\d{1,2})?$'
      example: '5000.00'

    Money:
      type: string
      description: An amount or balance returned by the API, in naira as a decimal string with exactly two decimal places.
      pattern: '^-?\d{1,15}\.\d{2}$'
      example: '5000.00'

    AccountNumber:
      type: string
      description: 10-digit account number.
      pattern: '^\d{10}$'
      example: '2000000110'

    InstitutionCode:
      type: string
      description: 6-digit NIBSS institution code. 1UBank is `090605`.
      pattern: '^\d{6}$'
      example: '000013'

    TransactionReference:
      type: string
      description: |
        The client's own reference. Required on every call that moves money; unique across all clients;
        reusing it returns the original result.
      pattern: '^[A-Za-z0-9_-]{1,50}$'
      example: TRX-123456ABCDEF012345

    Narration:
      type: string
      maxLength: 100
      description: Shown on statements. 1UBank adds both account numbers to it.
      example: Payment for invoice 1042

    Institution:
      type: object
      required: [institutionCode, institutionName]
      properties:
        institutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        institutionName:
          type: string
          example: GTBank

    NameEnquiryRequest:
      type: object
      required: [destinationInstitutionCode, destinationAccountNumber]
      properties:
        sourceAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: The owned account the transfer will come from. Optional.
        destinationInstitutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        destinationAccountNumber:
          $ref: '#/components/schemas/AccountNumber'

    NameEnquiryResponse:
      type: object
      required: [destinationInstitutionCode, destinationBankName, destinationAccountNumber, destinationAccountName]
      properties:
        destinationInstitutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        destinationBankName:
          type: string
        destinationAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        destinationAccountName:
          type: string
        destinationAccountBvn:
          type: string
          description: The destination account holder's BVN, when the destination bank returns it.
        nameInquiryReference:
          type: string
          description: Name-enquiry reference. Send it with the interbank transfer.
        sessionId:
          type: string
          description: NIBSS session ID of the name enquiry.
        accountType:
          type: string
          description: Type of the destination account, when the destination bank returns it.
        isCollectionAccount:
          type: boolean
          description: |
            `true` when the number is a 1UBank virtual account (static or dynamic) that collects
            payments for its owner, rather than a customer's own account.

    IntraBankTransferRequest:
      type: object
      required: [sourceAccountNumber, destinationAccountNumber, amount, narration, transactionReference]
      properties:
        sourceAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: The owned account to debit.
        destinationAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          $ref: '#/components/schemas/Amount'
        narration:
          $ref: '#/components/schemas/Narration'
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'
        destinationAccountName:
          type: string
          description: Optional. Checked against the account if sent.
        channel:
          $ref: '#/components/schemas/Channel'
        location:
          $ref: '#/components/schemas/Location'

    InterbankTransferRequest:
      type: object
      required:
        - sourceAccountNumber
        - destinationInstitutionCode
        - destinationAccountNumber
        - nameInquiryReference
        - amount
        - narration
        - transactionReference
      properties:
        sourceAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: The owned account to debit, for the amount plus the fee.
        destinationInstitutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        destinationAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        destinationAccountName:
          type: string
          description: The name from name enquiry.
        destinationBankName:
          type: string
        destinationAccountBvn:
          type: string
          description: |
            The destination account holder's BVN from name enquiry
            when it returned one.
        nameInquiryReference:
          type: string
          description: From name enquiry.
        amount:
          $ref: '#/components/schemas/Amount'
        narration:
          $ref: '#/components/schemas/Narration'
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'
        channel:
          $ref: '#/components/schemas/Channel'
        location:
          $ref: '#/components/schemas/Location'

    Channel:
      type: string
      description: |
        Where the customer made the transfer. Decides which limits apply. Defaults to `IN_APP`
        for client applications.
      enum: [IN_APP, IN_BRANCH]
      default: IN_APP

    Location:
      type: object
      description: Where the customer was, if the client has it. Stored for fraud and dispute checks.
      properties:
        latitude:
          type: number
        longitude:
          type: number
        locationAccuracy:
          type: number
          description: Metres.
        locationSource:
          type: string
          example: GPS

    TransactionStatus:
      type: string
      description: |
        - `PENDING`: accepted and debited; the outcome is not known yet.
        - `SENT_TO_GATEWAY_SUCCESS`: NIBSS accepted the transfer (response code `00`).
        - `CONFIRMED`: final success. Intra-bank transfers are always `CONFIRMED`; interbank
          transfers become `CONFIRMED` once a status query confirms them.
        - `REJECTED`: refused; the debit was reversed and the money is back in the source account.
        - `UNDER_REVIEW`: the outcome is still unknown after status queries. The money is held
          while Operations check the NIBSS settlement report. **Do not refund the customer:**
          the transfer may still have reached the recipient. It ends as `CONFIRMED`, `REVERSED`
          or `DISPUTED`.
        - `REVERSED`: it was under review and Operations returned the money to the source account.
        - `DISPUTED`: raised with NIBSS as a dispute; the money stays held until it is settled.
      enum: [PENDING, SENT_TO_GATEWAY_SUCCESS, CONFIRMED, REJECTED, UNDER_REVIEW, REVERSED, DISPUTED]

    Transfer:
      type: object
      required:
        - transactionReference
        - transferType
        - transactionStatus
        - sourceAccountNumber
        - destinationInstitutionCode
        - destinationAccountNumber
        - amount
        - fee
        - currency
        - transactionDate
      properties:
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'
        transactionId:
          type: string
          description: |
            The core ledger's ID: the account-transfer ID for an intra-bank transfer, the debit's
            transaction ID for an interbank transfer. Use it with the transaction details call.
        transferType:
          type: string
          enum: [INTRA_BANK, INTERBANK]
        transactionStatus:
          $ref: '#/components/schemas/TransactionStatus'
        responseCode:
          type: string
          description: NIBSS response code, for interbank transfers once NIBSS has answered.
          example: '00'
        sessionId:
          type: string
          description: NIBSS session ID, for interbank transfers. The recipient's bank knows the transfer by it.
          example: '090605261108101500123456789012'
        sourceAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        destinationInstitutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        destinationBankName:
          type: string
        destinationAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        destinationAccountName:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
          description: Fee charged on top of the amount, VAT and stamp duty included. `0.00` for intra-bank.
          multipleOf: 0.01
          example: 10.75
        currency:
          type: string
          const: NGN
        narration:
          $ref: '#/components/schemas/Narration'
        transactionDate:
          type: string
          format: date-time

    Bvn:
      type: string
      description: 11-digit Bank Verification Number.
      pattern: '^\d{11}$'
      example: '22200000001'

    ClientType:
      type: string
      enum: [PERSON, BUSINESS]

    CreateIndividualRequest:
      type: object
      required: [firstName, lastName, email, mobileNumber, bvn, address, productId, kycLevel]
      properties:
        firstName:
          type: string
          minLength: 1
        middleName:
          type: string
        lastName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
          format: date
          example: '1999-06-15'
        email:
          type: string
          format: email
        mobileNumber:
          type: string
          example: '08012345678'
        bvn:
          $ref: '#/components/schemas/Bvn'
        nin:
          $ref: '#/components/schemas/Nin'
        tin:
          $ref: '#/components/schemas/Tin'
        address:
          $ref: '#/components/schemas/Address'
        productId:
          type: integer
          format: int64
          description: Product for the first account. See `GET /v1/products`.
        kycLevel:
          type: integer
          minimum: 1
          description: The KYC level (tier) the customer qualified for. See `PUT /v1/customers/{clientId}/kyc-level`.
        transactionLimit:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Optional. The customer's own daily transfer limit; see `PUT /v1/customers/{clientId}/transaction-limit`.
        pep:
          allOf:
            - $ref: '#/components/schemas/Pep'
        riskRating:
          $ref: '#/components/schemas/CustomerRiskRating'
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: Optional. Send one to make a retry return the original result instead of `409 CUSTOMER_EXISTS`.

    CreateBusinessRequest:
      type: object
      required: [businessName, email, mobileNumber, bvn, address, productId, kycLevel]
      properties:
        businessName:
          type: string
          minLength: 1
          description: The registered business name.
        registrationDate:
          type: string
          format: date
          description: The date the business was registered.
          example: '2019-03-01'
        email:
          type: string
          format: email
        mobileNumber:
          type: string
          example: '08012345678'
        bvn:
          $ref: '#/components/schemas/Bvn'
        cacNumber:
          $ref: '#/components/schemas/CacNumber'
        tin:
          $ref: '#/components/schemas/Tin'
        address:
          $ref: '#/components/schemas/Address'
        productId:
          type: integer
          format: int64
          description: Product for the first account. See `GET /v1/products`.
        kycLevel:
          type: integer
          minimum: 1
          description: The KYC level (tier) the customer qualified for. See `PUT /v1/customers/{clientId}/kyc-level`.
        relatedPersons:
          type: array
          description: The business's directors and signatories. Optional.
          items:
            $ref: '#/components/schemas/RelatedPerson'
        transactionLimit:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: Optional. The customer's own daily transfer limit; see `PUT /v1/customers/{clientId}/transaction-limit`.
        pep:
          allOf:
            - $ref: '#/components/schemas/Pep'
        riskRating:
          $ref: '#/components/schemas/CustomerRiskRating'
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: Optional. Send one to make a retry return the original result instead of `409 CUSTOMER_EXISTS`.
    CreateCustomerResponse:
      type: object
      required: [accountNumber, id, clientId, clientType, productId]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        id:
          type: integer
          format: int64
          description: The account's ID in the core ledger (`savingsId`).
        clientId:
          type: integer
          format: int64
          description: The customer's ID. Keep it; customer calls use it.
        clientType:
          $ref: '#/components/schemas/ClientType'
        firstName:
          type: string
          description: Individuals only.
        lastName:
          type: string
          description: Individuals only.
        businessName:
          type: string
          description: Businesses only.
        email:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        dateOfBirth:
          type: string
          format: date
          description: Individuals only.
        registrationDate:
          type: string
          format: date
          description: Businesses only.
        mobileNumber:
          type: string
        productId:
          type: integer
          format: int64
        subLedgerActivated:
          type: boolean

    CustomerSearchRequest:
      type: object
      minProperties: 1
      properties:
        bvn:
          $ref: '#/components/schemas/Bvn'
        email:
          type: string
          format: email
        mobileNumber:
          type: string

    Customer:
      type: object
      required: [clientId, clientType, kycLevel, status]
      properties:
        clientId:
          type: integer
          format: int64
        clientType:
          $ref: '#/components/schemas/ClientType'
        firstName:
          type: string
          description: Individuals only.
        middleName:
          type: string
          description: Individuals only.
        lastName:
          type: string
          description: Individuals only.
        businessName:
          type: string
          description: Businesses only.
        email:
          type: string
        mobileNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
          description: Individuals only.
        registrationDate:
          type: string
          format: date
          description: Businesses only.
        bvn:
          $ref: '#/components/schemas/Bvn'
        nin:
          $ref: '#/components/schemas/Nin'
        cacNumber:
          $ref: '#/components/schemas/CacNumber'
        tin:
          $ref: '#/components/schemas/Tin'
        address:
          $ref: '#/components/schemas/Address'
        kycLevel:
          type: integer
          minimum: 1
          description: A KYC level (tier) configured in the bank; 1 to 3 always exist.
        pep:
          $ref: '#/components/schemas/Pep'
        riskRating:
          $ref: '#/components/schemas/CustomerRiskRating'
        transactionLimit:
          $ref: '#/components/schemas/Money'
        relatedPersons:
          type: array
          items:
            $ref: '#/components/schemas/RelatedPerson'
        status:
          type: string
          enum: [ACTIVE, INACTIVE, CLOSED]

    Pep:
      type: boolean
      description: |
        Whether the customer is a politically exposed person, from the client's onboarding checks.
        Optional; a PEP's transactions are monitored more strictly.

    CustomerRiskRating:
      type: string
      description: The customer's risk rating from the client's onboarding checks. Optional.
      enum: [LOW, MEDIUM, HIGH]

    SetRiskProfileRequest:
      type: object
      minProperties: 1
      description: Send either or both; a field left out keeps its current value.
      properties:
        pep:
          $ref: '#/components/schemas/Pep'
        riskRating:
          $ref: '#/components/schemas/CustomerRiskRating'

    RiskProfile:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: integer
          format: int64
        pep:
          $ref: '#/components/schemas/Pep'
        riskRating:
          $ref: '#/components/schemas/CustomerRiskRating'

    SetKycLevelRequest:
      type: object
      required: [kycLevel]
      properties:
        kycLevel:
          type: integer
          minimum: 1
          description: A KYC level (tier) configured in the bank; 1 to 3 always exist.
        clientId:
          type: integer
          format: int64
          description: Optional; if sent, must match the path.

    KycLevel:
      type: object
      required: [clientId, kycLevel]
      properties:
        clientId:
          type: integer
          format: int64
        kycLevel:
          type: integer
          minimum: 1
          description: A KYC level (tier) configured in the bank; 1 to 3 always exist.

    SetTransactionLimitRequest:
      type: object
      required: [transactionLimit]
      properties:
        transactionLimit:
          $ref: '#/components/schemas/Amount'

    SetTransactionLimitResponse:
      type: object
      required: [clientId, transactionLimit]
      properties:
        clientId:
          type: integer
          format: int64
        transactionLimit:
          $ref: '#/components/schemas/Money'

    Address:
      type: object
      required: [addressLine1]
      description: |
        A customer's address. `state` and `country` are names, for example `Lagos` and `Nigeria`
        (see the bank's lists); `country` defaults to `Nigeria`.
      properties:
        addressLine1:
          type: string
          maxLength: 500
        addressLine2:
          type: string
          maxLength: 500
        addressLine3:
          type: string
          maxLength: 500
        street:
          type: string
          maxLength: 100
        townVillage:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
          description: County or district, for example the local government area.
        state:
          type: string
          example: Lagos
        country:
          type: string
          example: Nigeria
        postalCode:
          type: string
          maxLength: 10

    Nin:
      type: string
      description: 11-digit National Identification Number.
      pattern: '^\d{11}$'
      example: '12345678901'

    CacNumber:
      type: string
      description: The business's CAC registration number, for example `RC123456`. For businesses only.
      pattern: '^[A-Za-z0-9/-]{1,20}$'
      example: RC123456

    Tin:
      type: string
      description: Tax Identification Number, for example `12345678-0001`.
      pattern: '^[0-9][0-9-]{7,19}$'
      example: 12345678-0001

    RelatedPerson:
      type: object
      description: A director or signatory of a business customer.
      required: [firstName, lastName, role]
      properties:
        firstName:
          type: string
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [DIRECTOR, SIGNATORY, DIRECTOR_AND_SIGNATORY]
        bvn:
          $ref: '#/components/schemas/Bvn'
        nin:
          $ref: '#/components/schemas/Nin'
        dateOfBirth:
          type: string
          format: date
        mobileNumber:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 100
        address:
          type: string
          maxLength: 250
        ownershipPercentage:
          type: number
          minimum: 0
          maximum: 100
          description: Share of the business the person owns, in percent.

    UpdateIndividualRequest:
      type: object
      minProperties: 1
      description: Send only the fields that change. `address` replaces the customer's address as a whole.
      properties:
        firstName:
          type: string
          minLength: 1
        middleName:
          type: string
        lastName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
          format: date
        email:
          type: string
          format: email
        mobileNumber:
          type: string
          minLength: 1
        bvn:
          $ref: '#/components/schemas/Bvn'
        nin:
          $ref: '#/components/schemas/Nin'
        tin:
          $ref: '#/components/schemas/Tin'
        address:
          $ref: '#/components/schemas/Address'

    UpdateBusinessRequest:
      type: object
      minProperties: 1
      description: |
        Send only the fields that change. `address` replaces the business's address as a whole; `relatedPersons`,
        when sent, replaces the whole list.
      properties:
        businessName:
          type: string
          minLength: 1
        registrationDate:
          type: string
          format: date
        email:
          type: string
          format: email
        mobileNumber:
          type: string
          minLength: 1
        bvn:
          $ref: '#/components/schemas/Bvn'
        cacNumber:
          $ref: '#/components/schemas/CacNumber'
        tin:
          $ref: '#/components/schemas/Tin'
        address:
          $ref: '#/components/schemas/Address'
        relatedPersons:
          type: array
          items:
            $ref: '#/components/schemas/RelatedPerson'

    OpenAccountRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
          description: Optional; if sent, must match the path.
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: Optional. Send one to make a retry return the account first opened instead of opening another.

    Account:
      type: object
      required: [accountNumber, savingsId, clientId, productId, status, currency, currentBalance, availableBalance]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        savingsId:
          type: integer
          format: int64
          description: The account's ID in the core ledger.
        clientId:
          type: integer
          format: int64
        accountName:
          type: string
        productId:
          type: integer
          format: int64
        productName:
          type: string
        accountType:
          $ref: '#/components/schemas/AccountType'
        status:
          type: string
          enum: [ACTIVE, DORMANT, RESTRICTED, CLOSED]
        currency:
          type: string
          const: NGN
        currentBalance:
          $ref: '#/components/schemas/Money'
          description: Ledger balance.
        availableBalance:
          $ref: '#/components/schemas/Money'
          description: Balance that can be spent now, after holds.
        kycLevel:
          type: integer
          minimum: 1
          description: A KYC level (tier) configured in the bank; 1 to 3 always exist.

    Product:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        description:
          type: string

    PaymentType:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Send as `paymentType` on a service debit.
        description:
          type: string

    AccountSearchRequest:
      type: object
      required: [bvn]
      properties:
        bvn:
          $ref: '#/components/schemas/Bvn'

    CustomerPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        nextCursor:
          type: string
          description: Send as `cursor` for the next page. Absent on the last page.

    AccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        nextCursor:
          type: string
          description: Send as `cursor` for the next page. Absent on the last page.

    VirtualAccountLabel:
      type: string
      minLength: 1
      maxLength: 50
      description: |
        The client's part of the name payers see on name enquiry. The bank puts the owner's name
        in front of it: `<owner's name> - <label>`.

    VirtualAccountType:
      type: string
      description: |
        What a static virtual account is for.

        - `SMART_TRANSFER`: a Smart Transfer group's account.
        - `AIRTIME`: airtime top-up; the account number is the customer's phone number.
        - `CASHIER_COLLECTION`: a business cashier's collection account.
        - `MERCHANT_COLLECTION`: a merchant's collection account.
        - `ELECTRICITY`: an electricity utility account.
        - `CABLE_TV`: a cable TV utility account.
      enum: [SMART_TRANSFER, AIRTIME, CASHIER_COLLECTION, MERCHANT_COLLECTION, ELECTRICITY, CABLE_TV]

    CreateVirtualAccountRequest:
      type: object
      required: [label, parentAccountNumber, type]
      properties:
        label:
          $ref: '#/components/schemas/VirtualAccountLabel'
        parentAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: An owned account.
        type:
          $ref: '#/components/schemas/VirtualAccountType'
        accountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: Required for `AIRTIME`, refused for any other type. The customer's phone number without the leading 0.
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: Optional. Send one to make a retry return the original virtual account.

    VirtualAccount:
      type: object
      required: [accountNumber, name, label, parentAccountNumber, type, status, createdDate]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        name:
          type: string
          description: 'The name payers see on name enquiry: `<owner''s name> - <label>`.'
        label:
          $ref: '#/components/schemas/VirtualAccountLabel'
        parentAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        type:
          $ref: '#/components/schemas/VirtualAccountType'
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time

    VirtualAccountPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VirtualAccount'
        nextCursor:
          type: string

    BlockType:
      type: string
      description: |
        - `CREDIT`: no money in.
        - `DEBIT`: no money out.
        - `ALL`: neither.
      enum: [CREDIT, DEBIT, ALL]

    PlaceBlockRequest:
      type: object
      required: [type, reason]
      properties:
        type:
          $ref: '#/components/schemas/BlockType'
        reason:
          type: string
          maxLength: 100

    AccountBlocks:
      type: object
      required: [accountNumber, block]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        block:
          type: string
          description: |
            - `NONE`: not blocked.
            - `CREDIT`: no money in.
            - `DEBIT`: no money out.
            - `ALL`: neither.
          enum: [NONE, CREDIT, DEBIT, ALL]
        reason:
          type: string
          description: The reason given when the account was last blocked. Absent when not blocked.

    InvoiceAmountRule:
      type: string
      description: |
        Which payment amounts an invoice accepts.

        - `ANY`: any amount.
        - `EXACT`: only `amount`.
        - `AT_LEAST`: `amount` or more.
      default: ANY
      enum: [ANY, EXACT, AT_LEAST]

    CreateInvoiceRequest:
      type: object
      required: [invoiceReference, collectionAccountNumber, amount]
      properties:
        invoiceReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: The client's reference for this payment attempt; one invoice per reference.
        collectionAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: An owned account; the payment is credited there.
        amount:
          allOf:
            - $ref: '#/components/schemas/Amount'
          description: The expected amount.
        amountRule:
          $ref: '#/components/schemas/InvoiceAmountRule'
        multiplePayments:
          type: boolean
          default: false
          description: '`true` accepts payments until `expiryDate`; `false` refuses payments after the first accepted one.'
        description:
          type: string
          maxLength: 100
        label:
          allOf:
            - $ref: '#/components/schemas/VirtualAccountLabel'
          description: 'Shown after the collection account owner''s name on name enquiry: `<owner''s name> - <label>`.'
        customerEmail:
          type: string
          format: email
        expiryDate:
          type: string
          format: date-time
          description: At most 60 minutes ahead. Defaults to 60 minutes.

    Invoice:
      type: object
      required: [invoiceReference, accountNumber, collectionAccountNumber, amount, status, expiryDate, createdDate]
      properties:
        invoiceReference:
          $ref: '#/components/schemas/TransactionReference'
        accountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: The number the payer transfers to.
        accountName:
          type: string
          description: The name the payer sees on name enquiry.
        collectionAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          $ref: '#/components/schemas/Money'
        amountRule:
          $ref: '#/components/schemas/InvoiceAmountRule'
        multiplePayments:
          type: boolean
        description:
          type: string
        label:
          type: string
        customerEmail:
          type: string
        status:
          type: string
          description: |
            - `PENDING`: waiting for payment.
            - `PAID`: paid before `expiryDate`.
            - `EXPIRED`: not paid by `expiryDate`. Later payments to the number are refused.
          enum: [PENDING, PAID, EXPIRED]
        amountPaid:
          $ref: '#/components/schemas/Money'
          description: What arrived, the total of all accepted payments. May differ from `amount` under `ANY`.
        sessionId:
          type: string
          description: NIBSS session ID of the payment.
        payer:
          $ref: '#/components/schemas/Counterparty'
        paidDate:
          type: string
          format: date-time
        expiryDate:
          type: string
          format: date-time
        createdDate:
          type: string
          format: date-time

    Counterparty:
      type: object
      description: The other side of a transfer.
      properties:
        accountName:
          type: string
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        institutionCode:
          $ref: '#/components/schemas/InstitutionCode'
        bankName:
          type: string

    PlaceHoldRequest:
      type: object
      required: [accountNumber, amount, reason, transactionReference]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          type: string
          maxLength: 100
          description: Why the money is held.
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'

    ReleaseHoldRequest:
      description: Either `transactionReference`, or `accountNumber` with `holdTransactionId`.
      oneOf:
        - type: object
          title: By reference
          required: [transactionReference]
          properties:
            transactionReference:
              $ref: '#/components/schemas/TransactionReference'
        - type: object
          title: By hold transaction ID
          required: [accountNumber, holdTransactionId]
          properties:
            accountNumber:
              $ref: '#/components/schemas/AccountNumber'
            holdTransactionId:
              type: integer
              format: int64

    Hold:
      type: object
      required: [holdTransactionId, accountNumber, amount, status, createdDate]
      properties:
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: The client's reference. Absent for migrated holds.
        holdTransactionId:
          type: integer
          format: int64
          description: The hold's transaction ID in the core ledger.
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        savingsId:
          type: integer
          format: int64
        clientId:
          type: integer
          format: int64
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, RELEASED]
        createdDate:
          type: string
          format: date-time
        releasedDate:
          type: string
          format: date-time

    ServiceDebitRequest:
      type: object
      required: [accountNumber, paymentType, amount, transactionReference]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        paymentType:
          type: string
          description: The name of one of the client's payment types.
        amount:
          $ref: '#/components/schemas/Amount'
        narration:
          $ref: '#/components/schemas/Narration'
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'

    ServiceDebit:
      type: object
      required: [transactionReference, transactionId, accountNumber, paymentType, amount, transactionStatus, transactionDate]
      properties:
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'
        transactionId:
          type: string
          description: The debit's transaction ID in the core ledger.
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        paymentType:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        narration:
          $ref: '#/components/schemas/Narration'
        transactionStatus:
          type: string
          const: CONFIRMED
        transactionDate:
          type: string
          format: date-time

    TransactionType:
      type: string
      enum: [CREDIT, DEBIT]

    AccountType:
      type: string
      description: '`CUSTOMER` for a customer''s own account; `STATIC_VA` or `DYNAMIC_VA` for virtual accounts.'
      enum: [CUSTOMER, STATIC_VA, DYNAMIC_VA]

    TransactionKind:
      type: string
      description: What the transaction was.
      enum:
        - INTRA_BANK_TRANSFER
        - INTERBANK_TRANSFER
        - INBOUND_TRANSFER
        - SERVICE_DEBIT
        - FEE
        - REVERSAL
        - INTEREST
        - CHARGE
        - OTHER

    Transaction:
      type: object
      required: [transactionId, accountNumber, transactionType, kind, amount, currency, transactionStatus, reversed, intraBank, transactionDate]
      properties:
        transactionId:
          type: string
          description: The core ledger's ID.
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        kind:
          $ref: '#/components/schemas/TransactionKind'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          const: NGN
        balanceBefore:
          $ref: '#/components/schemas/Money'
          description: Balance before the transaction.
        balanceAfter:
          $ref: '#/components/schemas/Money'
          description: Balance after the transaction.
        narration:
          type: string
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: The client's reference, when the transaction came from one of its calls.
        sessionId:
          type: string
          description: NIBSS session ID, for NIP transfers in or out.
        paymentReference:
          type: string
          description: The sender's payment reference on an inbound NIP transfer, when sent.
        virtualAccountType:
          allOf:
            - $ref: '#/components/schemas/VirtualAccountType'
          description: For a transaction on a virtual account, its type.
        invoiceReference:
          type: string
          description: The invoice paid, for a payment into a dynamic virtual account.
        paymentType:
          type: string
          description: The payment type's name.
        transactionStatus:
          type: string
          description: '`CONFIRMED` once posted. For an interbank transfer''s debit, the transfer''s own status is on `GET /v1/transfers/{transactionReference}`.'
          enum: [CONFIRMED]
        reversed:
          type: boolean
          description: '`true` when this transaction was later reversed.'
        intraBank:
          type: boolean
          description: '`true` when this is one side of an intra-bank transfer.'
        transfer:
          $ref: '#/components/schemas/TransferLegs'
        counterparty:
          allOf:
            - $ref: '#/components/schemas/Counterparty'
          description: |
            The other side: for a credit, the sender; for a debit, the recipient.
        transactionDate:
          type: string
          format: date-time

    TransferLegs:
      type: object
      description: Both sides of an intra-bank transfer. Present only when `intraBank` is `true`.
      required: [transferId, fromAccountNumber, fromTransactionId, toAccountNumber, toTransactionId]
      properties:
        transferId:
          type: string
          description: The account-transfer ID in the core ledger; the transfer's `transactionId`.
        fromAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        fromTransactionId:
          type: string
        toAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        toTransactionId:
          type: string

    TransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type: string

    Event:
      type: object
      description: One message on the client's SQS queue. See the Events section for each `eventType`.
      required: [eventId, eventType, schemaVersion, occurredAt, data]
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique per event. An ID already processed should be ignored.
        eventType:
          type: string
          enum:
            - AccountCredited
            - AccountDebited
            - TransferStatusChanged
            - InvoicePaid
            - InvoiceExpired
            - CustomerCreated
            - CustomerKycLevelChanged
            - AccountOpened
        schemaVersion:
          type: integer
          minimum: 1
          description: |
            The layout of this event type's message, starting at `1`. Adding a field keeps the
            version; removing or renaming one raises it, and both versions are sent until every
            client has moved to the new one.
        occurredAt:
          type: string
          format: date-time
        accountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: The account the event is about, when there is one.
        clientId:
          type: integer
          format: int64
          description: The customer the event is about.
        data:
          oneOf:
            - $ref: '#/components/schemas/AccountPostingEventData'
            - $ref: '#/components/schemas/TransferStatusChangedEventData'
            - $ref: '#/components/schemas/InvoiceEventData'
            - $ref: '#/components/schemas/CustomerEventData'
            - $ref: '#/components/schemas/AccountOpenedEventData'
      example:
        eventId: 3f9a2c1e-7b4d-4e8a-9c21-5d6e7f8a9b0c
        eventType: AccountCredited
        schemaVersion: 1
        occurredAt: '2026-11-08T10:30:00+01:00'
        accountNumber: '9000001234'
        clientId: 10
        data:
          transactionId: '95720'
          kind: INBOUND_TRANSFER
          amount: '20000.00'
          balanceAfter: '20000.00'
          narration: Shop payment
          sessionId: '000013261108103000123456789012'
          virtualAccountType: SMART_TRANSFER
          parentAccountNumber: '2000000158'
          counterparty:
            accountName: JOHN DOE
            accountNumber: '0123456789'
            institutionCode: '000013'
            bankName: GTBank

    AccountPostingEventData:
      type: object
      description: For `AccountCredited` and `AccountDebited`.
      required: [transactionId, kind, amount]
      properties:
        transactionId:
          type: string
        kind:
          $ref: '#/components/schemas/TransactionKind'
        amount:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
        transactionReference:
          allOf:
            - $ref: '#/components/schemas/TransactionReference'
          description: The client's reference, when the posting came from one of its calls.
        sessionId:
          type: string
          description: NIBSS session ID, for NIP transfers.
        virtualAccountType:
          allOf:
            - $ref: '#/components/schemas/VirtualAccountType'
          description: For a virtual account, its type.
        parentAccountNumber:
          allOf:
            - $ref: '#/components/schemas/AccountNumber'
          description: For a virtual account, its parent account.
        invoiceReference:
          type: string
          description: For a payment into a dynamic virtual account.
        counterparty:
          allOf:
            - $ref: '#/components/schemas/Counterparty'
          description: The sender of a credit or the recipient of a debit.

    TransferStatusChangedEventData:
      type: object
      required: [transactionReference, transactionStatus, previousStatus]
      properties:
        transactionReference:
          $ref: '#/components/schemas/TransactionReference'
        transactionStatus:
          $ref: '#/components/schemas/TransactionStatus'
        previousStatus:
          $ref: '#/components/schemas/TransactionStatus'
        responseCode:
          type: string
        sessionId:
          type: string

    InvoiceEventData:
      type: object
      description: For `InvoicePaid` and `InvoiceExpired`.
      required: [invoiceReference, invoiceAccountNumber, collectionAccountNumber, status]
      properties:
        invoiceReference:
          type: string
        invoiceAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        collectionAccountNumber:
          $ref: '#/components/schemas/AccountNumber'
        status:
          type: string
          enum: [PAID, EXPIRED]
        amount:
          $ref: '#/components/schemas/Money'
        amountPaid:
          $ref: '#/components/schemas/Money'
        transactionId:
          type: string
          description: The credit to the collection account, for `InvoicePaid`.
        sessionId:
          type: string
        payer:
          $ref: '#/components/schemas/Counterparty'

    CustomerEventData:
      type: object
      description: For `CustomerCreated` and `CustomerKycLevelChanged`.
      required: [clientId, kycLevel]
      properties:
        clientId:
          type: integer
          format: int64
        kycLevel:
          type: integer
          minimum: 1
          description: A KYC level (tier) configured in the bank; 1 to 3 always exist.
        previousKycLevel:
          type: integer
          minimum: 1
          description: For `CustomerKycLevelChanged`.

    AccountOpenedEventData:
      type: object
      required: [accountNumber, clientId, accountType]
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        clientId:
          type: integer
          format: int64
        accountType:
          $ref: '#/components/schemas/AccountType'
        productId:
          type: integer
          format: int64
